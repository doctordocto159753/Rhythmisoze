# US-0002 / US-1301 - the quality gate every change passes.
#
# Four jobs, in the order a failure is cheapest to read:
#   verify   typecheck, lint and unit tests - seconds, catches most things
#   build    the real production build, because "it compiles" is not "it builds"
#   golden   regenerates the humtool fixtures from Python and fails if the port
#            has drifted from the reference implementation
#   e2e      the browser matrix
#   musician the AI Musician service, on deterministic fake adapters
#
# `golden` is the unusual one and it is the point: the retouch engine is a port,
# and a port that is not continuously re-verified against its source is just a
# rewrite that happened to start from a copy.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  golden:
    name: humtool port parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --quiet numpy pretty_midi
      - name: Regenerate fixtures from the Python reference
        run: python scripts/generate-golden-fixtures.py
      - name: Fail if the committed fixtures no longer match the reference
        run: git diff --exit-code tests/fixtures/golden
      - name: Re-run the parity suite against the fresh fixtures
        run: npx vitest run tests/unit/retouch-golden.test.ts

  e2e:
    name: Browser matrix
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        # The capture project drives a synthesised hum through getUserMedia and
        # is the only job that exercises the transcription worker end to end.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  musician:
    name: AI Musician service and frontend chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The orchestrator's runtime. The model workers pin their own older
          # interpreters inside their images; nothing here imports them.
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        working-directory: services/musician
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -e "api[dev]"

      - name: Test
        working-directory: services/musician
        # No model weights, and no network. Both models sit behind adapters with
        # deterministic fakes, so the whole pipeline - orchestration, Identity
        # Guard, ranking, span selection, contract, API - is exercised here
        # without downloading 1.43 GB (AC-09). The real-model suite is opt-in
        # via MUSICIAN_REAL_MODELS=1 and is skipped by this run.
        run: python -m pytest -q

      - name: Install web dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the production web app
        run: npm run build

      - name: Prove the frontend-to-service Musician chain
        # Uses the real Next routes and FastAPI service with deterministic fake
        # model adapters. This catches deployment/status and wire-contract drift
        # without downloading model weights.
        run: npm run test:e2e:musician

      - name: No weights were downloaded
        # Asserted rather than trusted. The guarantee that CI never pulls
        # gigabytes is worth one line, and it fails loudly the day someone adds
        # a fetch to a fixture.
        run: |
          if find models vendor -type f ! -name '.gitkeep' ! -name 'README.md'                ! -name 'manifest.json' | grep -q .; then
            echo "::error::CI downloaded model artifacts; it must not"
            find models vendor -type f
            exit 1
          fi
          echo "clean: no model artifacts present"

  containers:
    name: Container build and compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose files are valid
        # Catches a malformed overlay before it reaches a server, which is the
        # cheapest possible place to catch it.
        env:
          SITE_DOMAIN: ci.example.com
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.production.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.gpu.yaml config >/dev/null
          echo "all three compose configurations parse"

      - name: Only the reverse proxy is publicly exposed
        # The single most important production property, asserted rather than
        # reviewed. Model workers hold gigabytes of weights and have no
        # authentication; a stray `ports:` entry would put one on the internet.
        env:
          SITE_DOMAIN: ci.example.com
        run: |
          python3 - <<'PY'
          import subprocess, yaml, sys
          raw = subprocess.run(
              ["docker","compose","-f","compose.yaml","-f","compose.production.yaml","config"],
              capture_output=True, text=True, check=True).stdout
          services = yaml.safe_load(raw)["services"]
          published = {n for n, s in services.items() if s.get("ports")}
          if published != {"caddy"}:
              print(f"::error::expected only caddy to publish ports, found {sorted(published)}")
              sys.exit(1)
          print("only caddy publishes ports")
          PY

      - name: No model weight is tracked
        # The accident this branch exists to correct, turned into a gate.
        run: |
          found=$(git ls-files | grep -E '\.(pth|pt|ckpt|safetensors|gguf|onnx)$' || true)
          if [ -n "$found" ]; then
            echo "::error::model weights are tracked: $found"
            exit 1
          fi
          echo "no model weights tracked"

      - name: Build the web image
        run: docker build -t rhythmisoze-web:ci .

      - name: Build the musician images
        run: |
          docker build -t rhythmisoze-api:ci -f services/musician/api/Dockerfile services/musician
          echo "orchestrator builds; the model workers need vendored upstream source and are built at deploy time"

      - name: Smoke the stack with fake adapters
        # No weights, no network to a model. Proves the containers talk to each
        # other, which the unit suites cannot.
        run: |
          docker network create rhy-ci
          docker run -d --name api --network rhy-ci             -e MUSICIAN_ADAPTERS=fake -e MUSICIAN_DEVICE=cpu             rhythmisoze-api:ci
          for i in $(seq 1 30); do
            if docker run --rm --network rhy-ci curlimages/curl:latest                  -fsS http://api:8080/ready >/dev/null 2>&1; then
              echo "musician-api is ready with fake adapters"
              docker run --rm --network rhy-ci curlimages/curl:latest -fsS http://api:8080/v1/models
              docker rm -f api >/dev/null; docker network rm rhy-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs api
          docker rm -f api >/dev/null; docker network rm rhy-ci >/dev/null
          exit 1
