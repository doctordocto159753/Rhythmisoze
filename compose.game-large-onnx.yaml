# Production-target configuration boundary for GAME large v1.0.3.
#
# The service intentionally reports /ready 503 with this overlay until the
# encoder -> D3PM -> estimator ONNX runner is implemented and parity-tested.
# This file makes the intended deployment configuration executable without
# pretending that merely mounting three graphs is a working inference path.
services:
  transcription:
    environment:
      GAME_BACKEND: onnx
      GAME_MODEL_TIER: large
      GAME_MODEL_VERSION: 1.0.3
