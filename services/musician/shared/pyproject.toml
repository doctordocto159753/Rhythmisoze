[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musician-shared"
version = "0.1.0"
description = "Canonical symbolic contract, Identity Guard and orchestration for the Rhythmisoze AI Musician"
requires-python = ">=3.11"
# Deliberately minimal. music21 and the model runtimes are dependencies of the
# containers that need them, not of the contract everything imports.
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
music21 = ["music21>=9.1,<10"]

[tool.setuptools.packages.find]
where = ["src"]
