[project]
name = "rhythmisoze-transcription"
version = "0.1.0"
description = "Authoritative server-side GAME transcription and rhythm-routing service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "numpy<2.0.0",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
# The PyTorch runtime remains available for the small development backend.
# Production uses the large GAME v1.0.3 ONNX graphs through onnxruntime.
real = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "librosa>=0.10",
  "einops>=0.7.0",
  "omegaconf>=2.3",
  "lightning>=2.3",
  "loguru>=0.7",
  "click>=8.1",
  "resampy>=0.4",
  "scipy>=1.10.0",
  "torchmetrics>=1.4",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
